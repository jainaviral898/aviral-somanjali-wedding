<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aviral & Somanjali · Save the Date · Kolkata</title>
  <meta name="description" content="Aviral & Somanjali are getting married. Save the date: 21 March 2027, Kolkata.">
  <meta property="og:title" content="Aviral & Somanjali · Save the Date">
  <meta property="og:description" content="21 March 2027 · Kolkata · Rosogulla meets kachori">
  <link rel="canonical" href="https://aviral-somanjali-wedding.in/kolkata/">
  <meta property="og:url" content="https://aviral-somanjali-wedding.in/kolkata/">
  <meta name="theme-color" content="#f8f3ea">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f8f3ea'/><text x='50' y='68' font-size='54' text-anchor='middle'>🌺</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Tiro+Devanagari+Hindi&family=Tiro+Bangla&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f8f3ea;
      --panel: #fdfaf4;
      --ink: #3a2a24;
      --muted: #7d6a5f;
      --red: #8e1b24;
      --gold: #b08d57;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--ink);
      background: var(--cream);
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(110px, 20vw, 140px) 16px clamp(110px, 20vw, 140px);
      overflow: hidden;
    }
    .corner { position: absolute; pointer-events: none; z-index: 2; }
    .corner.big { width: clamp(200px, 40vw, 460px); }
    .corner.small { width: clamp(130px, 24vw, 280px); }
    .tl { top: -12px; left: -12px; }
    .br { bottom: -12px; right: -12px; transform: scale(-1, -1); }
    .tr { top: -12px; right: -12px; transform: scaleX(-1); }
    .bl { bottom: -12px; left: -12px; transform: scaleY(-1); }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 470px;
      text-align: center;
      padding: clamp(86px, 22vw, 118px) clamp(24px, 7vw, 48px) 84px;
      animation: fade 1.4s ease both;
    }
    /* floral spray resting on the base of the arch */
    .base {
      position: absolute;
      left: 50%;
      bottom: -62px;
      width: 112%;
      transform: translateX(-50%);
      overflow: visible;
      pointer-events: none;
    }
    @keyframes fade { from { opacity: 0; transform: translateY(14px); } }
    .arch { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: -1; }
    .mandala {
      position: absolute;
      top: 38px;
      left: 50%;
      width: 74%;
      transform: translateX(-50%);
      opacity: .16;
      z-index: -1;
      animation: turn 160s linear infinite;
    }
    @keyframes turn { to { transform: translateX(-50%) rotate(360deg); } }

    .bless { font-size: 15px; color: var(--red); }
    .bless [lang="hi"] { font-family: "Tiro Devanagari Hindi", serif; }
    .bless [lang="bn"] { font-family: "Tiro Bangla", serif; }
    .bless i { color: var(--gold); font-style: normal; margin: 0 8px; }

    .std {
      margin-top: 22px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .48em;
      padding-left: .48em;
      text-transform: uppercase;
      color: var(--gold);
    }
    h1 {
      font-family: "Italiana", serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: .16em;
      padding-left: .16em;
      font-size: clamp(36px, 10vw, 58px);
      line-height: 1.1;
      margin-top: 12px;
      color: var(--red);
    }
    h1 .amp {
      display: block;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      text-transform: none;
      letter-spacing: 0;
      padding: 0;
      color: var(--red);
      font-size: .85em;
      line-height: 1;
      margin: 0 0 2px;
    }

    .tagline { margin-top: 14px; font-style: italic; font-size: clamp(19px, 5vw, 22px); color: var(--muted); }

    .paisley { display: block; width: 190px; margin: 22px auto; color: var(--gold); }

    .when {
      font-family: "Italiana", serif;
      font-size: clamp(30px, 8vw, 40px);
      letter-spacing: .18em;
      padding-left: .18em;
    }
    .when b { font-weight: 400; color: var(--red); margin: 0 .2em; }
    .month { margin-top: 4px; font-size: 15px; font-weight: 500; letter-spacing: .4em; padding-left: .4em; text-transform: uppercase; color: var(--muted); }
    .days { font-style: italic; font-size: 18px; color: var(--muted); margin-top: 2px; }

    .cities { margin-top: 20px; font-size: 13px; letter-spacing: .36em; padding-left: .36em; text-transform: uppercase; color: var(--ink); }
    .cities i { color: var(--gold); font-style: normal; margin: 0 6px; }

    .cd { margin-top: 18px; font-style: italic; font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .cd span { color: var(--red); font-style: normal; font-weight: 500; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 24px; }
    .btn {
      font: inherit; font-size: 15px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
      min-height: 44px; padding: 10px 22px; border-radius: 999px; cursor: pointer; text-decoration: none;
      border: 1px solid var(--ink); background: transparent; color: var(--ink);
      transition: background .2s, color .2s;
    }
    .btn:hover { background: var(--ink); color: var(--panel); }
    .btn.primary { background: var(--red); border-color: var(--red); color: var(--panel); }
    .btn.primary:hover { background: var(--ink); border-color: var(--ink); }
    .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .foot { margin-top: 20px; font-style: italic; color: var(--muted); }

    /* Phones (tuned for iPhone 17 / 17 Pro at 402×874, also 17 Pro Max 440×956 and Air 420×912):
       tighter rhythm so names, dates and the button sit above Safari's bottom toolbar */
    @media (max-width: 480px) {
      .page {
        min-height: 100svh;
        padding: calc(env(safe-area-inset-top) + 78px) max(14px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 72px) max(14px, env(safe-area-inset-left));
      }
      .corner.big { width: 47vw; }
      .corner.small { width: 30vw; }
      .card { padding: 74px 22px 68px; }
      .mandala { top: 26px; width: 80%; }
      .std { margin-top: 14px; }
      h1 { font-size: 10.4vw; margin-top: 8px; }
      .tagline { margin-top: 6px; font-size: 19px; }
      .paisley { width: 160px; margin: 14px auto; }
      .when { font-size: 34px; }
      .month { font-size: 14px; }
      .cities { margin-top: 12px; }
      .cd { margin-top: 10px; }
      .actions { margin-top: 16px; }
      .actions .btn { width: 100%; min-height: 48px; font-size: 16px; }
      .foot { margin-top: 12px; }
      .base { bottom: -52px; width: 118%; }
    }
    @media (prefers-reduced-motion: reduce) { .card, .mandala { animation: none; } }
  </style>
</head>
<body data-start="2027-03-21" data-end="2027-03-22" data-title="Aviral &amp; Somanjali's Wedding · Kolkata">
  <div class="page">
    <svg class="corner big tl" viewBox="0 0 420 420" aria-hidden="true"></svg>
    <svg class="corner big br" viewBox="0 0 420 420" aria-hidden="true"></svg>
    <svg class="corner small tr" viewBox="0 0 300 300" aria-hidden="true"></svg>
    <svg class="corner big bl" viewBox="0 0 420 420" aria-hidden="true"></svg>

    <main class="card">
      <svg class="arch" aria-hidden="true"></svg>
      <svg class="base" viewBox="0 0 520 150" aria-hidden="true"></svg>
      <svg class="mandala" viewBox="-100 -100 200 200" aria-hidden="true"></svg>

      <p class="bless"><span lang="bn">শুভ বিবাহ</span><i>✦</i><span lang="hi">शुभ विवाह</span></p>
      <p class="std">Save the Date</p>
      <h1>Aviral <span class="amp">&amp;</span> Somanjali</h1>
      <p class="tagline">Rosogulla meets kachori</p>

      <svg class="paisley" viewBox="0 0 150 24" aria-hidden="true" fill="currentColor">
        <rect x="0" y="11.5" width="50" height="1" opacity=".7"/>
        <rect x="100" y="11.5" width="50" height="1" opacity=".7"/>
        <path d="M66 18c-6 0-9-5-7-9 2-5 9-6 13-2 3 3 2 9-2 11 2-3 1-6-1-7-3-1-5 1-4 3 1 2 3 2 4 1-1 2-2 3-3 3z"/>
        <path d="M84 6c6 0 9 5 7 9-2 5-9 6-13 2-3-3-2-9 2-11-2 3-1 6 1 7 3 1 5-1 4-3-1-2-3-2-4-1 1-2 2-3 3-3z"/>
        <circle cx="54" cy="12" r="1.6"/><circle cx="96" cy="12" r="1.6"/>
      </svg>

      <p class="when">21</p>
      <p class="month">March 2027</p>
      <p class="days">Sunday</p>

      <p class="cities"><i>✿</i>Kolkata<i>✿</i></p>

      <p class="cd" aria-label="Countdown to the wedding"><span data-cd="d">--</span> days to go</p>

      <div class="actions">
        <a class="btn primary" data-gcal>Save to Calendar</a>
      </div>
      <p class="foot">Formal invitation to follow</p>
    </main>
  </div>

  <script src="/flora.js"></script>
  <script>
    floraDefs();
    const rand = rng(14);

    const big = [
      sprig(0, 40, 270, 98, "sage"),
      sprig(40, 0, 260, 162, "sage"),
      leaf(0, 120, 150, 122, "leaf"),
      leaf(110, 0, 150, 148, "leaf"),
      leaf(60, 50, 175, 135, "leaf"),
      leaf(0, 200, 110, 150, "sage"),
      leaf(200, 0, 110, 115, "sage"),
      bud(262, 52, 11, 118, "blush"),
      bud(52, 262, 11, 152, "rose"),
      rose(78, 72, 72, 10, "rose"),
      rose(190, 52, 46, 40, "blush"),
      rose(50, 190, 50, -20, "blush"),
      marigold(155, 145, 32, 0),
      marigold(232, 110, 19, 20),
      marigold(110, 228, 19, 0),
      jasmine(130, 205, 13, 10),
      jasmine(205, 168, 11, 40),
      jasmine(265, 88, 9, 0),
      dots(220, 200, 14, 40, "#e7cfa3", rand),
    ].join("");

    const small = [
      sprig(10, 10, 210, 128, "sage"),
      leaf(0, 70, 120, 128, "leaf"),
      leaf(70, 0, 120, 142, "leaf"),
      bud(150, 40, 9, 115, "blush"),
      rose(55, 50, 44, 20, "blush"),
      marigold(118, 92, 22, 0),
      jasmine(60, 130, 10, 0),
      dots(140, 140, 8, 30, "#e7cfa3", rand),
    ].join("");

    document.querySelectorAll(".corner.big").forEach((s) => (s.innerHTML = big));
    document.querySelectorAll(".corner.small").forEach((s) => (s.innerHTML = small));

    document.querySelector(".base").innerHTML = [
      sprig(260, 88, 240, -100, "sage"),
      sprig(260, 88, 240, 100, "sage"),
      leaf(240, 92, 130, -74, "leaf"),
      leaf(280, 92, 130, 74, "leaf"),
      leaf(232, 98, 110, -116, "sage"),
      leaf(288, 98, 110, 116, "sage"),
      bud(118, 72, 9, -62, "blush"),
      bud(402, 72, 9, 62, "blush"),
      marigold(182, 92, 22, 0),
      marigold(338, 92, 22, 10),
      rose(214, 82, 34, 10, "blush"),
      rose(306, 82, 34, -20, "blush"),
      rose(260, 76, 46, 0, "rose"),
      jasmine(156, 104, 10, 0),
      jasmine(364, 104, 10, 30),
      jasmine(238, 124, 8, 15),
      jasmine(284, 122, 8, 50),
      dots(260, 110, 10, 70, "#e7cfa3", rand),
    ].join("");
    document.querySelector(".mandala").innerHTML = mandala("#b08d57");

    // Jharokha arch sized to the card
    const card = document.querySelector(".card");
    const arch = document.querySelector(".arch");
    function drawArch() {
      const w = card.clientWidth;
      const h = card.clientHeight;
      arch.setAttribute("viewBox", `0 0 ${w} ${h}`);
      arch.innerHTML =
        `<path d="${archPath(w, h, 0)}" fill="#fdfaf4" fill-opacity=".94" stroke="#b08d57" stroke-width="1.2"/>` +
        `<path d="${archPath(w, h, 9)}" fill="none" stroke="#b08d57" stroke-width=".8" stroke-dasharray="1 4" stroke-linecap="round"/>` +
        `<path d="M${w / 2} -14c4 5 4 9 0 12-4-3-4-7 0-12z" fill="#b08d57"/>`;
    }
    drawArch();
    new ResizeObserver(drawArch).observe(card);
  </script>
  <script src="/common.js"></script>
</body>
</html>
